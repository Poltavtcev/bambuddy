# Builds this repo and pushes to ghcr.io/poltavtcev/bambuddy (for Home Assistant add-on).
name: Publish to GHCR

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure .git/HEAD exists
        run: test -f .git/HEAD || (mkdir -p .git && echo "ref: refs/heads/main" > .git/HEAD)

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/poltavtcev/bambuddy:latest
            ghcr.io/poltavtcev/bambuddy:${{ github.sha }}
